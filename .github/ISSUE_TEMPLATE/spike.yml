name: "Spike / Untersuchung"
description: "Zeitbegrenzte technische oder fachliche Untersuchung."
title: "[SPIKE] "
body:
  - type: textarea
    id: question
    attributes:
      label: "Untersuchungsfrage"
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: "Erwarteter Nachweis / Entscheidungskriterien"
    validations:
      required: true
  - type: input
    id: max-hours
    attributes:
      label: "Aufwandsschätzung / Zeitbox"
      placeholder: "2–4 Stunden"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Abhängigkeiten, Kosten und Risiken"
