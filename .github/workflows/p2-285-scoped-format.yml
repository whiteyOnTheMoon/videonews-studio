name: One-time P2-285 scoped formatting
on:
  push:
    branches:
      - feat/p2-01-signed-cross-uid-inbox-import
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-01-signed-cross-uid-inbox-import
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format four changed files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-01-signed-cross-uid-inbox-import
          npx prettier --write apps/worker/src/source-export-files.ts apps/worker/src/source-handoff-import-once.ts apps/worker/src/source-handoff-import-once.test.ts docs/P2-01_SOURCE_HANDOFF_IMPORT.md
          rm .github/workflows/p2-285-scoped-format.yml
          git add apps/worker/src/source-export-files.ts apps/worker/src/source-handoff-import-once.ts apps/worker/src/source-handoff-import-once.test.ts docs/P2-01_SOURCE_HANDOFF_IMPORT.md .github/workflows/p2-285-scoped-format.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): format signed handoff and remove temporary workflow'
          git push origin HEAD:refs/heads/feat/p2-01-signed-cross-uid-inbox-import
