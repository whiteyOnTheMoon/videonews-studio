name: P2-03 continuous producer queue progress health (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/worker/src/feed-producer-progress-guard.ts"
      - "apps/worker/src/feed-producer-progress-guard.test.ts"
      - "apps/worker/src/feed-producer-health-path.ts"
      - "apps/worker/src/feed-producer-healthcheck.ts"
      - "apps/worker/src/feed-producer-continuous.ts"
      - "docs/P2_03_CONTINUOUS_PRODUCER_PROGRESS_HEALTH.md"
      - ".github/workflows/p2-03-producer-progress.yml"
permissions:
  contents: read
concurrency:
  group: p2-03-producer-progress-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  queue-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and check formatting
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --check apps/worker/src/feed-producer-progress-guard.ts apps/worker/src/feed-producer-progress-guard.test.ts apps/worker/src/feed-producer-health-path.ts apps/worker/src/feed-producer-healthcheck.ts apps/worker/src/feed-producer-continuous.ts docs/P2_03_CONTINUOUS_PRODUCER_PROGRESS_HEALTH.md .github/workflows/p2-03-producer-progress.yml
      - name: Compile actual producer and dependency contracts
        run: |
          npm run build --workspace @vns/shared
          npm run build --workspace @vns/worker
      - name: Check queue progress timeout and separate producer admission
        run: |
          node --test apps/worker/dist/feed-producer-progress-guard.test.js apps/worker/dist/feed-scheduler-continuous.test.js apps/worker/dist/feed-consumer-health.test.js
