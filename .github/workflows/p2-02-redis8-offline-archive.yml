name: P2-02 Redis 8 offline archive validation
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p2_02_redis8_offline_archive.py"
      - "scripts/test_p2_02_redis8_offline_archive.py"
      - "scripts/ci_p2_02_redis8_offline_restore.py"
      - "scripts/ci_p2_02_redis8_paused_capture.py"
      - "docs/P2_02_REDIS8_OFFLINE_ARCHIVE_2026_11_11.md"
      - ".github/workflows/p2-02-redis8-offline-archive.yml"
permissions:
  contents: read
concurrency:
  group: redis8-offline-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-offline-archive-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
      VNS_P2_REDIS8_RESTORE_CI: "true"
      VNS_P2_REDIS8_PAUSE_CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Offline archive validator unit tests (synthetic only)
        run: |
          python3 -m unittest discover -s scripts \
            -p 'test_p2_02_redis8_offline_archive.py' -v
      - name: Verify independent Redis 8 replay on synthetic stopped-source AOF
        run: python3 scripts/ci_p2_02_redis8_offline_restore.py
      - name: Rehearse paused synthetic AOF capture and networkless recovery
        run: python3 scripts/ci_p2_02_redis8_paused_capture.py
      - name: Assert no compilation artifacts
        run: |
          test -z "$(git status --porcelain)"
