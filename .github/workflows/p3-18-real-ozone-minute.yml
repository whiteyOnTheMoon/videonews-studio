name: P3-18 authentic ozone one-minute editorial pilot proof
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p3_minute_editorial_layout.mjs"
      - "scripts/p3_layered_cinematic_composition.mjs"
      - "scripts/p3_ozone_minute_private_pilot.mjs"
      - "scripts/p3_ozone_minute_private_pilot.test.mjs"
      - "scripts/p3_18_create_media_draft.mjs"
      - "scripts/p3_18_audit_real_media.mjs"
      - "scripts/p3_18_audit_real_media.test.mjs"
      - "scripts/p3_18_centered_storyboard.mjs"
      - "scripts/p3_18_centered_storyboard.test.mjs"
      - "scripts/p3_18_vps_moving_design_preview.mjs"
      - "scripts/p3_18_vps_moving_design_preview.test.mjs"
      - "content/news/ozone-2026-minute-editorial-pilot-en.json"
      - "content/media/p3-18-ozone-pilot-candidate-review.json"
      - "docs/P3_18_ONE_MINUTE_AUTHENTIC_PILOT.md"
      - ".github/workflows/p3-18-real-ozone-minute.yml"
permissions:
  contents: read
jobs:
  ozone-minute-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate entire repository lint and P3-18 scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          node --check scripts/p3_minute_editorial_layout.mjs
          node --check scripts/p3_layered_cinematic_composition.mjs
          node --check scripts/p3_ozone_minute_private_pilot.mjs
          node --check scripts/p3_ozone_minute_private_pilot.test.mjs
          node --check scripts/p3_18_create_media_draft.mjs
          node --check scripts/p3_18_audit_real_media.mjs
          node --check scripts/p3_18_audit_real_media.test.mjs
          node --check scripts/p3_18_centered_storyboard.mjs
          node --check scripts/p3_18_centered_storyboard.test.mjs
          node --check scripts/p3_18_vps_moving_design_preview.mjs
          node --check scripts/p3_18_vps_moving_design_preview.test.mjs
          node scripts/p3_ozone_minute_private_pilot.mjs --check-editorial
      - name: Install offline FFmpeg test fixture encoder and SVG renderer
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg librsvg2-bin
      - name: Refuse any real media/Piper private render inside CI
        run: |
          if VNS_VPS_PREVIEW_APPROVED=PRIVATE_REVIEW_ONLY \
            node scripts/p3_ozone_minute_private_pilot.mjs --save-private; then
            echo "UNSAFE: real media preview must be refused in CI"
            exit 1
          fi
      - name: Verify unapproved NASA contact audit and unchanged synthetic original
        run: |
          node --test scripts/p3_18_audit_real_media.test.mjs
      - name: Verify large science stage and private contact storyboard using synthetic media
        run: |
          node --test scripts/p3_18_centered_storyboard.test.mjs
      - name: Refuse real NASA still storyboard inside CI
        run: |
          if VNS_VPS_PREVIEW_APPROVED=PRIVATE_REVIEW_ONLY \
            node scripts/p3_18_centered_storyboard.mjs --save-private; then
            echo "UNSAFE: real media storyboard must be refused in CI"
            exit 1
          fi
      - name: Validate VPS-safe moving design and real NASA rights refusal
        run: |
          if VNS_VPS_PREVIEW_APPROVED=PRIVATE_REVIEW_ONLY \
            node scripts/p3_18_vps_moving_design_preview.mjs --save-private; then
            echo "UNSAFE: NASA contact-still preview must be refused in CI"
            exit 1
          fi
          node --test scripts/p3_18_vps_moving_design_preview.test.mjs
      - name: Render 60-second ORIGINAL SYNTHETIC stand-in with real editorial script
        run: |
          env -u PEXELS_API_KEY \
            node --test scripts/p3_ozone_minute_private_pilot.test.mjs
