name: One-time P2-287 scoped formatting
on:
  push:
    branches:
      - feat/p2-02-bounded-feed-scheduler
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-02-bounded-feed-scheduler
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format three failing files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-02-bounded-feed-scheduler
          npx prettier --write apps/worker/src/bounded-feed-scheduler.ts apps/worker/src/bounded-feed-scheduler.test.ts scripts/test_p2_feed_compose.mjs
          rm .github/workflows/p2-287-scoped-format.yml
          git add apps/worker/src/bounded-feed-scheduler.ts apps/worker/src/bounded-feed-scheduler.test.ts scripts/test_p2_feed_compose.mjs .github/workflows/p2-287-scoped-format.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): format bounded scheduler and remove temporary workflow'
          git push origin HEAD:refs/heads/feat/p2-02-bounded-feed-scheduler
