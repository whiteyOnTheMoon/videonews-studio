name: P2-02 read-only RSS HEAD probe (offline unit tests)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p2_02_readonly_https_head_probe.mjs"
      - "scripts/p2_02_readonly_https_head_probe.test.mjs"
      - ".github/workflows/p2-02-readonly-head-probe.yml"
permissions:
  contents: read
jobs:
  no-network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check probe formatting and show exact diff on failure
        run: |
          files="scripts/p2_02_readonly_https_head_probe.mjs scripts/p2_02_readonly_https_head_probe.test.mjs"
          if ! npx prettier --check $files; then
            npx prettier --write $files
            git diff -- $files
            exit 1
          fi
      - run: node --test scripts/p2_02_readonly_https_head_probe.test.mjs
