name: P1-05 PostgreSQL migration tests

on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'scripts/test_p1_05_migrations.sh'
      - '.github/workflows/p1-05-database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vns_test
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: videonews_p105_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vns_test -d videonews_p105_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run forward and reverse migrations
        env:
          P1_05_TEST_DATABASE_URL: postgresql://vns_test:ci-only-throwaway-password@127.0.0.1:5432/videonews_p105_test
          P1_05_ALLOW_DESTRUCTIVE_TEST: 'yes'
        run: bash scripts/test_p1_05_migrations.sh
