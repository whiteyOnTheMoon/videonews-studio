name: P2-274 one-time scoped formatter
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/p2-274-temporary-formatter.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 274 && github.event.pull_request.head.repo.full_name == 'whiteyOnTheMoon/videonews-studio' && github.head_ref == 'feat/p2-09-10-personal-admin-exports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only identified files
        run: |
          npx prettier --write             apps/api/src/personal-editorial-admin.test.ts             apps/api/src/personal-editorial-admin.ts             apps/api/src/server.ts             apps/web/src/app/admin/editorial-admin.test.tsx             apps/web/src/app/admin/editorial-audit-export.tsx             apps/web/src/app/admin/editorial-profiles.tsx             apps/web/src/lib/admin-editorial-proxy.test.ts             apps/web/src/lib/admin-editorial-proxy.ts
      - name: Commit scoped formatting
        run: |
          if ! git diff --quiet --             apps/api/src/personal-editorial-admin.test.ts             apps/api/src/personal-editorial-admin.ts             apps/api/src/server.ts             apps/web/src/app/admin/editorial-admin.test.tsx             apps/web/src/app/admin/editorial-audit-export.tsx             apps/web/src/app/admin/editorial-profiles.tsx             apps/web/src/lib/admin-editorial-proxy.test.ts             apps/web/src/lib/admin-editorial-proxy.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --               apps/api/src/personal-editorial-admin.test.ts               apps/api/src/personal-editorial-admin.ts               apps/api/src/server.ts               apps/web/src/app/admin/editorial-admin.test.tsx               apps/web/src/app/admin/editorial-audit-export.tsx               apps/web/src/app/admin/editorial-profiles.tsx               apps/web/src/lib/admin-editorial-proxy.test.ts               apps/web/src/lib/admin-editorial-proxy.ts
            git commit -m "style: apply Prettier to P2-274 files"
            git push origin HEAD:refs/heads/feat/p2-09-10-personal-admin-exports
          fi
