name: P3 episode asset research library proof
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p3_episode_asset_library.mjs"
      - "scripts/p3_episode_asset_library.test.mjs"
      - "scripts/p3_episode_asset_workspace.mjs"
      - "scripts/p3_episode_asset_research_cli.mjs"
      - "docs/P3_EPISODE_ASSET_LIBRARY.md"
      - "scripts/p3_post_editorial_asset_handoff.mjs"
      - "scripts/p3_post_editorial_asset_handoff_cli.mjs"
      - "scripts/p3_post_editorial_asset_handoff.test.mjs"
      - "docs/P3_POST_EDITORIAL_MEDIA_HANDOFF.md"
      - "scripts/p3_reviewed_media_selection.mjs"
      - "scripts/p3_reviewed_media_selection_cli.mjs"
      - "scripts/p3_reviewed_media_selection.test.mjs"
      - "docs/P3_REVIEWED_MEDIA_SELECTION.md"
      - "scripts/p3_media_candidate_ranking.mjs"
      - "scripts/p3_media_review_board.mjs"
      - "scripts/p3_media_review_board.test.mjs"
      - "docs/P3_OFFLINE_MEDIA_REVIEW_BOARD.md"
      - "scripts/p3_visual_similarity.mjs"
      - "scripts/p3_visual_similarity.test.mjs"
      - "docs/P3_VISUAL_SIMILARITY.md"
      - ".github/workflows/p3-episode-asset-library.yml"
permissions:
  contents: read
jobs:
  asset-library-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check offline library code and repository lint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          node --check scripts/p3_episode_asset_library.mjs
          node --check scripts/p3_episode_asset_workspace.mjs
          node --check scripts/p3_episode_asset_research_cli.mjs
          node --check scripts/p3_post_editorial_asset_handoff.mjs
          node --check scripts/p3_post_editorial_asset_handoff_cli.mjs
          node --check scripts/p3_reviewed_media_selection.mjs
          node --check scripts/p3_reviewed_media_selection_cli.mjs
          node --check scripts/p3_media_candidate_ranking.mjs
          node --check scripts/p3_media_review_board.mjs
          node --check scripts/p3_visual_similarity.mjs
      - name: Install local-only FFmpeg test fixture tooling
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Prove bounded search and export-hash-gated cleanup without providers
        run: |
          env -u PEXELS_API_KEY node --test scripts/p3_episode_asset_library.test.mjs
          env -u PEXELS_API_KEY node --test scripts/p3_post_editorial_asset_handoff.test.mjs
          env -u PEXELS_API_KEY node --test scripts/p3_reviewed_media_selection.test.mjs
          env -u PEXELS_API_KEY node --test scripts/p3_media_review_board.test.mjs
          env -u PEXELS_API_KEY node --test scripts/p3_visual_similarity.test.mjs
