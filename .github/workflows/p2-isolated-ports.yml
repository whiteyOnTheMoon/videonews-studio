name: P2 isolated Redis PostgreSQL handoff
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "db/migrations/**"
      - "scripts/ci_p2_integrated_ports.mjs"
      - "scripts/ci_p2_separated_ports.mjs"
      - "scripts/test_p2_feed_compose.mjs"
      - "scripts/p2_feed_host_preflight.py"
      - "scripts/test_p2_feed_host_preflight.py"
      - "compose.feed-observation.yaml"
      - ".github/workflows/p2-isolated-ports.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vns_p2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_postgres_for_disposable_runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vns_p2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      VNS_P2_ISOLATED_PORT_TEST: "true"
      VNS_P2_CI_PG_PASSWORD: ci_only_postgres_for_disposable_runner
      VNS_P2_CI_FEED_PASSWORD: ci_only_feed_for_disposable_runner
      VNS_P2_CI_EXPORT_PASSWORD: ci_only_source_export_runner
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: vns_p2_ci
      PGUSER: postgres
      PGPASSWORD: ci_only_postgres_for_disposable_runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check code formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: Verify disabled signed-source Compose architecture
        run: node --test scripts/test_p2_feed_compose.mjs
      - name: Validate signed feed Docker profiles without starting containers
        env:
          VNS_P2_PUBLISHER_DIR: /tmp/vns-ci/signer
          VNS_P2_SIGNER_DB_PASSWORD_FILE: /tmp/vns-ci/signing-db-pass
          VNS_P2_PRIVATE_SIGNING_KEY_FILE: /tmp/vns-ci/ed25519-private
          VNS_P2_HANDOFF_STAGING_DIR: /tmp/vns-ci/staging
          VNS_P2_WORKER_INBOX_DIR: /tmp/vns-ci/inbox
          VNS_P2_PINNED_PUBLIC_KEY_FILE: /tmp/vns-ci/ed25519-public
          VNS_P2_WORKER_CHECKPOINT_DIR: /tmp/vns-ci/checkpoint
          VNS_P2_ANCHOR_DB_PASSWORD_FILE: /tmp/vns-ci/anchor-password
          VNS_P2_ANCHOR_CA_FILE: /tmp/vns-ci/anchor-ca
          VNS_P2_FEED_DB_PASSWORD_FILE: /tmp/vns-ci/feed-db-pass
          VNS_P2_FEED_REDIS_PASSWORD_FILE: /tmp/vns-ci/feed-redis-pass
          VNS_P2_FEED_PRODUCER_REDIS_PASSWORD_FILE: /tmp/vns-ci/feed-producer-redis-pass
        run: |
          docker compose -f compose.yaml -f compose.feed-observation.yaml \
            --profile data --profile source-signing --profile source-handoff \
            --profile feed-observation --profile feed-scheduler \
            --profile feed-producer --profile feed-consumer config --quiet
      - name: Test read-only host UID and secrets preflight with synthetic filesystem metadata
        run: python3 -m unittest discover -s scripts -p "test_p2_feed_host_preflight.py" -v
      - name: Compile shared and worker contracts
        run: |
          npm run build --workspace @vns/shared
          npm run build --workspace @vns/worker
      - name: Build complete disposable schema and isolated least-privilege login
        run: |
          set -euo pipefail
          for migration in db/migrations/*.up.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration" > /dev/null
          done
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vns_feed_login_ciunit LOGIN INHERIT PASSWORD 'ci_only_feed_for_disposable_runner';
          GRANT vns_feed_poll_writer TO vns_feed_login_ciunit;
          GRANT USAGE ON SCHEMA vns TO vns_feed_login_ciunit;
          CREATE ROLE vns_source_export_login_ciunit LOGIN INHERIT PASSWORD 'ci_only_source_export_runner';
          GRANT vns_source_export_reader TO vns_source_export_login_ciunit;
          GRANT USAGE ON SCHEMA vns TO vns_source_export_login_ciunit;
          SQL
      - name: Verify Redis queue, PostgreSQL persistence and never-publish review
        run: node --test scripts/ci_p2_integrated_ports.mjs
      - name: Verify independent producer and consumer against disposable Redis ACLs
        run: node --test scripts/ci_p2_separated_ports.mjs
