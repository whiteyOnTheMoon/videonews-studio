name: P2-A temporary official feeds Prettier output
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/p2-a-public-feed-licensing-and-compatibility-gate-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical format
        run: |
          npx prettier --write \
            scripts/p2_a_source_readiness.mjs \
            scripts/test_p2_a_source_readiness.mjs
          node -e "const fs=require('fs');for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            scripts/p2_a_source_readiness.mjs \
            scripts/test_p2_a_source_readiness.mjs
