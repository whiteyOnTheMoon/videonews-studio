name: P2-01 one-shot signed source staging (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p2_01_signed_handoff_stage.mjs"
      - "scripts/test_p2_01_signed_handoff_stage.mjs"
      - "scripts/test_p2_01_signed_stage_to_import.mjs"
      - "apps/worker/src/source-export-files.ts"
      - "apps/worker/src/source-export-signature.ts"
      - "apps/worker/src/source-registry-export.ts"
      - "docs/P2_01_SIGNED_SOURCE_STAGE_HANDOFF.md"
      - ".github/workflows/p2-01-signed-source-stage.yml"
permissions:
  contents: read
concurrency:
  group: p2-01-signed-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  signed-source-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Temporary capture canonical signed pipeline formatting
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write scripts/test_p2_01_signed_stage_to_import.mjs docs/P2_01_SIGNED_SOURCE_STAGE_HANDOFF.md
          node -e 'const fs=require("node:fs");for(const p of ["scripts/test_p2_01_signed_stage_to_import.mjs","docs/P2_01_SIGNED_SOURCE_STAGE_HANDOFF.md"])console.log("VNS_FORMATTED_FILE="+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))'
      - name: Enforce formatting for signed staging changes
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --check scripts/p2_01_signed_handoff_stage.mjs scripts/test_p2_01_signed_handoff_stage.mjs scripts/test_p2_01_signed_stage_to_import.mjs docs/P2_01_SIGNED_SOURCE_STAGE_HANDOFF.md .github/workflows/p2-01-signed-source-stage.yml
      - name: Test staging with disposable Ed25519 keys and synthetic UIDs
        run: sudo -n node --test scripts/test_p2_01_signed_handoff_stage.mjs
      - name: Build canonical worker publisher and importer
        run: |
          npm run build --workspace @vns/shared
          npm run build --workspace @vns/worker
      - name: Verify stage to actual isolated worker UID importer
        run: sudo -n env CI=true node --test scripts/test_p2_01_signed_stage_to_import.mjs
