name: P1-09 offline cost model checks
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p1_09_cost_model.py"
      - "scripts/test_p1_09_cost_model.py"
      - "docs/P1-09_OFFLINE_OBSERVABILITY.md"
      - "docs/P1-09_BESZEL_MONITORING.md"
      - "docs/P1-09_ENGLISH_AI_PROVIDER_POLICY.md"
      - "docs/P1-09_MOCK_OPENAI_RESPONSES.md"
      - ".github/workflows/p1-09-offline-observability.yml"
permissions:
  contents: read
concurrency:
  group: p1-09-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline per-job token cost estimates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_p1_09_cost_model.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export exact formatted SQL adapter (temporary)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write apps/api/src/postgres-provider-config-store.ts
          echo '===VNSFMT_START:provider-store.ts==='
          base64 -w0 apps/api/src/postgres-provider-config-store.ts
          echo
          echo '===VNSFMT_END:provider-store.ts==='
          git restore -- apps/api/src/postgres-provider-config-store.ts
      - name: Assert no tracked changes
        run: test -z "$(git status --porcelain)"
