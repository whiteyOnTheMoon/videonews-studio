name: P1-09 additive Redis producer ACL (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p1-09-redis-producer-acl.yml"
      - "scripts/p1_09_redis_producer_acl_rollout.py"
      - "scripts/test_p1_09_redis_producer_acl_rollout.py"
      - "scripts/ci_p1_09_redis_producer_acl.sh"
      - "scripts/p1_09_provider_outbox_custody.py"
permissions:
  contents: read
concurrency:
  group: p1-09-redis-producer-acl-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  additive-redis-producer-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify original-user preservation and deny unsafe ACL mutations
        run: python3 -m unittest discover -s scripts -p 'test_p1_09_redis_producer_acl_rollout.py' -v
      - name: Install only synthetic credentials into disposable isolated Redis 7
        run: bash scripts/ci_p1_09_redis_producer_acl.sh
