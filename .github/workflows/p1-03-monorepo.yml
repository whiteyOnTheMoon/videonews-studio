name: P1-03 monorepo checks
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/ci_editor_account_lifecycle.mjs"
      - "scripts/test_editor_auth_integration.mjs"
      - "scripts/ci_audit_export.mjs"
      - "scripts/ci_signed_audit_replay.mjs"
      - "scripts/test_db_login_roles.mjs"
      - "scripts/test_recovery_readiness.mjs"
      - "scripts/ci_outbox_recovery_audit.mjs"
      - "scripts/test_ci_outbox_recovery_audit.mjs"
      - "scripts/test_ci_redis_aof_restore.mjs"
      - "scripts/ci_aof_archive_preflight.mjs"
      - "scripts/test_ci_aof_archive_preflight.mjs"
      - "scripts/ci_sealed_backup.mjs"
      - "scripts/test_ci_sealed_backup.mjs"
      - "docs/P1-07_BACKUP_KEY_CUSTODY.md"
      - "docs/P1-07_RECOVERY_RUNBOOK.md"
      - "docs/P0_P1_ISSUE_CLOSEOUT.md"
      - "docs/p1-07-recovery-plan.json"
      - "docs/p1-07-recovery-inventory.json"
      - "docs/P1-07_RECOVERY_INVENTORY.md"
      - "scripts/test_recovery_inventory.mjs"
      - "compose.yaml"
      - "docs/p1-07-compose-recovery-map.json"
      - "scripts/ci_compose_recovery_drift.mjs"
      - "scripts/test_compose_recovery_drift.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".github/workflows/p1-03-monorepo.yml"
permissions:
  contents: read
jobs:
  monorepo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile workspace applications
        run: npm run build
      - name: Type-check all workspaces
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Formatting
        run: |
          npm run format:check || {
            npx prettier --write apps/worker/src/source-export-signature.ts apps/worker/src/source-export-files.ts apps/worker/src/source-export-files.test.ts
            git --no-pager diff -- apps/worker/src/source-export-signature.ts apps/worker/src/source-export-files.ts apps/worker/src/source-export-files.test.ts
            exit 1
          }
      - name: Verify P1-01 importer on integrated branch
        run: node --test scripts/import-issues.test.mjs
      - name: Verify P1-02 governance on integrated branch
        run: |
          node --test scripts/test_check_pr.mjs
          python3 -m unittest discover -s scripts -p 'test_github_governance.py'
      - name: Unit tests
        run: npm test
