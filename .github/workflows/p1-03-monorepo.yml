name: P1-03 monorepo checks
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".github/workflows/p1-03-monorepo.yml"
permissions:
  contents: read
jobs:
  monorepo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile workspace applications
        run: npm run build
      - name: Type-check all workspaces
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Temporary Prettier capture for integration formatting
        run: |
          npx prettier --write 'compose.yaml' 'docs/DEPLOYMENT.md' 'docs/IMAGE_DISTRIBUTION.md' 'docs/INTERNAL_PREVIEW.md'
          node -e 'const fs=require("fs");const files=["compose.yaml","docs/DEPLOYMENT.md","docs/IMAGE_DISTRIBUTION.md","docs/INTERNAL_PREVIEW.md"];files.forEach((p,i)=>{const b=fs.readFileSync(p).toString("base64");for(let k=0;k<b.length;k+=1200)console.log("VNSFMT_"+i+"_"+String(k/1200).padStart(4,"0")+"="+b.slice(k,k+1200))});'
      - name: Formatting
        run: npm run format:check
      - name: Verify P1-01 importer on integrated branch
        run: node --test scripts/import-issues.test.mjs
      - name: Verify P1-02 governance on integrated branch
        run: |
          node --test scripts/test_check_pr.mjs
          python3 -m unittest discover -s scripts -p 'test_github_governance.py'
      - name: Unit tests
        run: npm test
