name: P1-03 monorepo checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/p1-03-monorepo.yml'
permissions:
  contents: read
jobs:
  monorepo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (temporary until lockfile is committed)
        run: npm install --no-audit --no-fund
      - name: Emit generated lockfile chunks for versioning
        run: |
          node -e 'const fs=require("node:fs");const b64=fs.readFileSync("package-lock.json").toString("base64");for(let i=0;i<b64.length;i+=1800)console.log("VNS_LOCK_PART_"+String(i/1800).padStart(5,"0")+"="+b64.slice(i,i+1800));'
      - name: Compile workspace applications
        run: npm run build
      - name: Type-check all workspaces
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
