name: One-time P2 host preflight documentation formatting
on:
  push:
    branches:
      - feat/p2-signed-feed-host-rollout-preflight
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-signed-feed-host-rollout-preflight
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format two documentation files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-signed-feed-host-rollout-preflight
          npx prettier --write docs/P2_FEED_HOST_RELEASE_PREFLIGHT.md docs/P2_FEED_SIGNED_COMPOSE_OPERATOR_CONTRACT.md
          rm .github/workflows/p2-host-preflight-format-once.yml
          git add docs/P2_FEED_HOST_RELEASE_PREFLIGHT.md docs/P2_FEED_SIGNED_COMPOSE_OPERATOR_CONTRACT.md .github/workflows/p2-host-preflight-format-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): format host release preflight docs and self-remove'
          git push origin HEAD:refs/heads/feat/p2-signed-feed-host-rollout-preflight
