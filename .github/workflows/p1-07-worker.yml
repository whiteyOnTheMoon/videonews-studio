name: P1-07 BullMQ worker integration (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "deploy/compose.worker.yaml"
      - "Dockerfile"
      - "package-lock.json"
      - "db/scripts/test_worker_queue.sh"
      - "scripts/test_worker_integration.mjs"
      - "scripts/test_worker_recovery.mjs"
      - "scripts/test_outbox_integration.mjs"
      - "scripts/test_ci_runtime_roles.mjs"
      - "scripts/test_ci_runtime_logins.mjs apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-separated-roles.test.ts scripts/ci_p2_separated_ports.mjs apps/worker/src/feed-consumer-health.test.ts apps/worker/src/feed-scheduler-continuous.ts apps/worker/src/feed-scheduler-continuous.test.ts apps/worker/src/feed-queue-inspection.ts apps/worker/src/feed-queue-inspection.test.ts apps/worker/src/feed-producer-continuous.ts apps/worker/src/feed-producer-healthcheck.ts apps/worker/src/feed-consumer-watchdog.ts apps/worker/src/feed-queue-operations.ts apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-bullmq-separated.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-separated-redis.ts scripts/ci_p2_separated_ports.mjs scripts/test_p2_feed_compose.mjs compose.feed-observation.yaml docs/P2-02_CONTINUOUS_OPERATIONS_RUNBOOK.md"
      - "scripts/test_job_status_integration.mjs"
      - "scripts/ci_stalled_probe_worker.mjs"
      - "scripts/provision_redis_secrets.py"
      - "apps/worker/src/source-policy.ts"
      - "apps/worker/src/source-policy.test.ts"
      - "apps/worker/src/source-fetch.ts"
      - "apps/worker/src/source-fetch.test.ts"
      - "apps/worker/src/editorial-routing.ts"
      - "apps/worker/src/editorial-routing.test.ts"
      - "apps/worker/src/research-process.ts"
      - "apps/worker/src/research-process.test.ts"
      - "scripts/test_research_process_integration.mjs"
      - "scripts/ci_outbox_recovery_audit.mjs"
      - "scripts/test_ci_outbox_recovery_audit.mjs"
      - "scripts/test_ci_redis_aof_restore.mjs"
      - "scripts/ci_aof_archive_preflight.mjs"
      - "scripts/test_ci_aof_archive_preflight.mjs"
      - "db/scripts/test_redis_aof_restore.sh"
      - ".github/workflows/p1-07-worker.yml"
# Cancel only superseded runs of this workflow on the same pull request.
# Latest-head checks still have to pass before merging.
concurrency:
  group: p1-07-worker-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure package-lock reflects changed production dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '===VNS_LOCK_START==='
          git diff --no-color -- package-lock.json
          echo '===VNS_LOCK_END==='
          git diff --exit-code -- package-lock.json
      - name: Install dependencies from pinned lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify formatting and emit reviewable patch if needed
        run: |
          npx prettier --write .github/workflows/p1-06-admin-compose.yml .github/workflows/p1-07-readiness.yml .github/workflows/p1-07-worker.yml apps/worker/src/queue.test.ts apps/worker/src/queue.ts docs/P1_06_COMPOSE_SECRETS.md docs/P1-07_BACKEND_READINESS.md scripts/test_worker_integration.mjs scripts/test_worker_recovery.mjs scripts/ci_stalled_probe_worker.mjs scripts/test_outbox_integration.mjs apps/worker/src/outbox.ts apps/worker/src/outbox.test.ts apps/worker/src/dispatch.ts apps/worker/src/job-status.ts apps/worker/src/job-status.test.ts apps/worker/src/status-sync.ts scripts/test_job_status_integration.mjs apps/worker/src/source-policy.ts apps/worker/src/source-policy.test.ts apps/worker/src/source-fetch.ts apps/worker/src/source-fetch.test.ts apps/worker/src/research-process.ts apps/worker/src/research-process.test.ts scripts/ci_outbox_recovery_audit.mjs scripts/test_ci_outbox_recovery_audit.mjs scripts/test_ci_redis_aof_restore.mjs scripts/test_research_process_integration.mjs apps/worker/src/runtime-db.ts apps/worker/src/runtime-db.test.ts apps/worker/src/editorial-routing.ts apps/worker/src/editorial-routing.test.ts apps/worker/src/research-catalog.ts apps/worker/src/research-catalog.test.ts apps/worker/src/research-service-config.ts apps/worker/src/research-service-config.test.ts apps/worker/src/research-service.ts scripts/test_ci_runtime_roles.mjs scripts/test_ci_runtime_logins.mjs apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-separated-roles.test.ts scripts/ci_p2_separated_ports.mjs apps/worker/src/feed-consumer-health.test.ts apps/worker/src/feed-scheduler-continuous.ts apps/worker/src/feed-scheduler-continuous.test.ts apps/worker/src/feed-queue-inspection.ts apps/worker/src/feed-queue-inspection.test.ts apps/worker/src/feed-producer-continuous.ts apps/worker/src/feed-producer-healthcheck.ts apps/worker/src/feed-consumer-watchdog.ts apps/worker/src/feed-queue-operations.ts apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-bullmq-separated.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-separated-redis.ts scripts/ci_p2_separated_ports.mjs scripts/test_p2_feed_compose.mjs compose.feed-observation.yaml docs/P2-02_CONTINUOUS_OPERATIONS_RUNBOOK.md
          echo '===VNS_FORMAT_START==='
          git diff --no-color -- .github/workflows/p1-06-admin-compose.yml .github/workflows/p1-07-readiness.yml .github/workflows/p1-07-worker.yml apps/worker/src/queue.test.ts apps/worker/src/queue.ts docs/P1_06_COMPOSE_SECRETS.md docs/P1-07_BACKEND_READINESS.md scripts/test_worker_integration.mjs scripts/test_worker_recovery.mjs scripts/ci_stalled_probe_worker.mjs scripts/test_outbox_integration.mjs apps/worker/src/outbox.ts apps/worker/src/outbox.test.ts apps/worker/src/dispatch.ts apps/worker/src/job-status.ts apps/worker/src/job-status.test.ts apps/worker/src/status-sync.ts scripts/test_job_status_integration.mjs apps/worker/src/source-policy.ts apps/worker/src/source-policy.test.ts apps/worker/src/source-fetch.ts apps/worker/src/source-fetch.test.ts apps/worker/src/research-process.ts apps/worker/src/research-process.test.ts scripts/ci_outbox_recovery_audit.mjs scripts/test_ci_outbox_recovery_audit.mjs scripts/test_ci_redis_aof_restore.mjs scripts/test_research_process_integration.mjs apps/worker/src/runtime-db.ts apps/worker/src/runtime-db.test.ts apps/worker/src/editorial-routing.ts apps/worker/src/editorial-routing.test.ts apps/worker/src/research-catalog.ts apps/worker/src/research-catalog.test.ts apps/worker/src/research-service-config.ts apps/worker/src/research-service-config.test.ts apps/worker/src/research-service.ts scripts/test_ci_runtime_roles.mjs scripts/test_ci_runtime_logins.mjs apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-separated-roles.test.ts scripts/ci_p2_separated_ports.mjs apps/worker/src/feed-consumer-health.test.ts apps/worker/src/feed-scheduler-continuous.ts apps/worker/src/feed-scheduler-continuous.test.ts apps/worker/src/feed-queue-inspection.ts apps/worker/src/feed-queue-inspection.test.ts apps/worker/src/feed-producer-continuous.ts apps/worker/src/feed-producer-healthcheck.ts apps/worker/src/feed-consumer-watchdog.ts apps/worker/src/feed-queue-operations.ts apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-bullmq-separated.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-separated-redis.ts scripts/ci_p2_separated_ports.mjs scripts/test_p2_feed_compose.mjs compose.feed-observation.yaml docs/P2-02_CONTINUOUS_OPERATIONS_RUNBOOK.md
          echo '===VNS_FORMAT_END==='
          git diff --exit-code -- .github/workflows/p1-06-admin-compose.yml .github/workflows/p1-07-readiness.yml .github/workflows/p1-07-worker.yml apps/worker/src/queue.test.ts apps/worker/src/queue.ts docs/P1_06_COMPOSE_SECRETS.md docs/P1-07_BACKEND_READINESS.md scripts/test_worker_integration.mjs scripts/test_worker_recovery.mjs scripts/ci_stalled_probe_worker.mjs scripts/test_outbox_integration.mjs apps/worker/src/outbox.ts apps/worker/src/outbox.test.ts apps/worker/src/dispatch.ts apps/worker/src/job-status.ts apps/worker/src/job-status.test.ts apps/worker/src/status-sync.ts scripts/test_job_status_integration.mjs apps/worker/src/source-policy.ts apps/worker/src/source-policy.test.ts apps/worker/src/source-fetch.ts apps/worker/src/source-fetch.test.ts apps/worker/src/research-process.ts apps/worker/src/research-process.test.ts scripts/ci_outbox_recovery_audit.mjs scripts/test_ci_outbox_recovery_audit.mjs scripts/test_ci_redis_aof_restore.mjs scripts/test_research_process_integration.mjs apps/worker/src/runtime-db.ts apps/worker/src/runtime-db.test.ts apps/worker/src/editorial-routing.ts apps/worker/src/editorial-routing.test.ts apps/worker/src/research-catalog.ts apps/worker/src/research-catalog.test.ts apps/worker/src/research-service-config.ts apps/worker/src/research-service-config.test.ts apps/worker/src/research-service.ts scripts/test_ci_runtime_roles.mjs scripts/test_ci_runtime_logins.mjs apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-separated-roles.test.ts scripts/ci_p2_separated_ports.mjs apps/worker/src/feed-consumer-health.test.ts apps/worker/src/feed-scheduler-continuous.ts apps/worker/src/feed-scheduler-continuous.test.ts apps/worker/src/feed-queue-inspection.ts apps/worker/src/feed-queue-inspection.test.ts apps/worker/src/feed-producer-continuous.ts apps/worker/src/feed-producer-healthcheck.ts apps/worker/src/feed-consumer-watchdog.ts apps/worker/src/feed-queue-operations.ts apps/worker/src/feed-worker-persistent.ts apps/worker/src/feed-bullmq-separated.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-separated-redis.ts scripts/ci_p2_separated_ports.mjs scripts/test_p2_feed_compose.mjs compose.feed-observation.yaml docs/P2-02_CONTINUOUS_OPERATIONS_RUNBOOK.md
      - name: Build and test compiled source
        run: |
          npm run build
          npm test
      - name: Run BullMQ probe integration against temporary authenticated Redis
        run: bash db/scripts/test_worker_queue.sh
      - name: Verify worker production-image build
        run: docker build --pull=false --target worker -t vns-p1-07-worker-ci .

  redis-aof-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check AOF fixture source formatting
        run: |
          npx prettier --write scripts/ci_aof_archive_preflight.mjs scripts/test_ci_aof_archive_preflight.mjs scripts/test_ci_redis_aof_restore.mjs
          git diff --exit-code -- scripts/ci_aof_archive_preflight.mjs scripts/test_ci_aof_archive_preflight.mjs scripts/test_ci_redis_aof_restore.mjs
      - name: Build shared and worker packages for isolated Redis fixture
        run: |
          npm run build --workspace @vns/shared
          npm run build --workspace @vns/worker
      - name: Recover Redis multipart AOF into a fresh container
        run: bash db/scripts/test_redis_aof_restore.sh
      - name: Verify source tree unchanged
        run: git diff --exit-code
