name: P1-04 manual private GHCR image publication
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Operator approval required. Images will be pushed to private GHCR packages."
        required: true
        default: DO_NOT_PUBLISH
        type: choice
        options:
          - DO_NOT_PUBLISH
          - PUBLISH_PRIVATE_IMAGES
      expected_sha:
        description: "Full SHA (40 hex characters) of the specifically approved main commit"
        required: true
        type: string
      visibility_check:
        description: "Confirm both target GHCR package names have no public package"
        required: true
        default: NOT_VERIFIED
        type: choice
        options:
          - NOT_VERIFIED
          - NO_PUBLIC_PACKAGE
concurrency:
  group: vns-ghcr-manual-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'PUBLISH_PRIVATE_IMAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed release approval, SHA and public-package checks
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VISIBILITY_CHECK: ${{ inputs.visibility_check }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = whiteyOnTheMoon/videonews-studio
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "BLOCKED: release SHA must exactly match the explicitly approved main commit" >&2
            exit 1
          fi
          if [ "$VISIBILITY_CHECK" != NO_PUBLIC_PACKAGE ]; then
            echo "BLOCKED: operator must verify that target packages are not public" >&2
            exit 1
          fi
          # GitHub's public REST endpoint lists publicly visible packages.
          # An already-public package name must never receive a VNS release.
          # 404 may mean absent OR private; the operator also checks Package settings.
          for package in videonews-studio-web videonews-studio-api; do
            status="$(curl --silent --show-error --location --output /dev/null \
              --write-out '%{http_code}' --max-time 15 \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/users/whiteyOnTheMoon/packages/container/$package")"
            case "$status" in
              404) echo "No public package found under $package; operator visibility check still required" ;;
              200) echo "BLOCKED: already-public GHCR package $package" >&2; exit 1 ;;
              *) echo "BLOCKED: cannot verify package visibility (HTTP $status)" >&2; exit 1 ;;
            esac
          done
      - name: Build only web and API with commit-specific tags
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          prefix="ghcr.io/$repo_lower"
          version="sha-$GITHUB_SHA"
          for target in web api; do
            docker build --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "${prefix}-${target}:${version}" .
          done
      - name: Verify internal HTTP endpoints without host exposure
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          prefix="ghcr.io/$repo_lower"
          version="sha-$GITHUB_SHA"
          trap 'docker rm -f vns-private-release-web vns-private-release-api >/dev/null 2>&1 || true' EXIT
          docker run -d --name vns-private-release-web --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --memory 640m --memory-swap 640m \
            --cpus 0.75 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,noexec,size=32m \
            --tmpfs /workspace/apps/web/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000 \
            "${prefix}-web:${version}"
          docker run -d --name vns-private-release-api --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --memory 192m --memory-swap 192m \
            --cpus 0.35 --pids-limit 128 --tmpfs /tmp:rw,nosuid,noexec,size=32m \
            -e API_HOST=0.0.0.0 -e API_PORT=4000 \
            "${prefix}-api:${version}"
          for entry in 'vns-private-release-web|http://127.0.0.1:3000/' 'vns-private-release-api|http://127.0.0.1:4000/healthz'; do
            container="${entry%%|*}"
            url="${entry#*|}"
            healthy=false
            for attempt in $(seq 1 30); do
              if docker exec "$container" node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' "$url" >/dev/null 2>&1; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              echo "Healthcheck failed for $container" >&2
              exit 1
            fi
          done
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish two images and record exact digests
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          prefix="ghcr.io/$repo_lower"
          version="sha-$GITHUB_SHA"
          for target in web api; do
            image="${prefix}-${target}:${version}"
            docker push "$image"
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
            test -n "$digest"
            printf '%s image: %s\n' "$target" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Images were published. Verify both packages remain private before any pull or deployment." >> "$GITHUB_STEP_SUMMARY"
