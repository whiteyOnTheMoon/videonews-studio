name: P2 rollout evidence gate offline tests
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p2_rollout_gate.mjs"
      - "scripts/p2_02_stage_a_vps_inventory.py"
      - "scripts/p2_a_readonly_acceptance.py"
      - "scripts/p2_a_schema_0048_to_0059.py"
      - "scripts/p2_owner_personal_db_enrollment.py"
      - "deploy/compose.personal-editorial-admin.yaml"
      - "scripts/test_p2_personal_editorial_compose.mjs"
      - "scripts/test_p2_owner_personal_db_enrollment.py"
      - "docs/P2_OWNER_PERSONAL_DB_ENROLLMENT.md"
      - "scripts/test_p2_a_schema_0048_to_0059.py"
      - "docs/P2_A_SCHEMA_ROLLOUT_0049_0059.md"
      - "scripts/test_p2_a_readonly_acceptance.py"
      - "docs/P2_A_READONLY_VPS_ACCEPTANCE_2026-10-29.md"
      - "scripts/test_p2_02_stage_a_vps_inventory.py"
      - "docs/P2-02_STAGE_A_READ_ONLY_VPS_AUDIT.md"
      - "docs/P2-02_IONOS_BESZEL_ACCEPTANCE_2026-10-27.md"
      - "scripts/test_p2_rollout_gate.mjs"
      - ".github/workflows/p2-rollout-gate.yml"
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate repository formatting
        run: |
          npm ci --no-audit --no-fund
          for file in apps/api/src/index.ts apps/api/src/personal-source-host-admin.ts apps/api/src/personal-source-host-admin.test.ts; do
            printf 'VNS_PRETTIER_BASE64_BEGIN:%s\\n' "$file"
            ./node_modules/.bin/prettier "$file" | base64 -w0
            echo
            printf 'VNS_PRETTIER_BASE64_END:%s\\n' "$file"
          done
          npm run format:check
      - name: Verify read-only Stage-A inventory with synthetic host and Docker states
        run: python3 -m unittest discover -s scripts -p "test_p2_02_stage_a_vps_inventory.py" -v
      - name: Check P2-A read-only schema and licensed-source acceptance preflight
        run: python3 -m unittest discover -s scripts -p "test_p2_a_readonly_acceptance.py" -v
      - name: Verify exact P2-A 0048-to-0059 controlled schema upgrade denial paths
        run: python3 -m unittest discover -s scripts -p "test_p2_a_schema_0048_to_0059.py" -v
      - name: Check personal web and API Compose gates remain independently disabled
        run: node --test scripts/test_p2_personal_editorial_compose.mjs
      - name: Test default-off existing-owner personal PostgreSQL enrollment
        run: python3 -m unittest discover -s scripts -p "test_p2_owner_personal_db_enrollment.py" -v
      - name: Run fail-closed manifest tests
        run: node --test scripts/test_p2_rollout_gate.mjs
      - name: Assert missing evidence blocks review
        run: |
          printf '%s\n' '{"schemaVersion":1,"mainSha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","evidence":{}}' > "$RUNNER_TEMP/empty.json"
          if node scripts/p2_rollout_gate.mjs "$RUNNER_TEMP/empty.json"; then
            echo "FAIL: missing evidence accepted"
            exit 1
          fi
