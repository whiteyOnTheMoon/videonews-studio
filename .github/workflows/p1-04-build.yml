name: P1-04 Docker image smoke tests
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package-lock.json
      - apps/**
      - packages/**
      - .github/workflows/p1-04-build.yml
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Build application images on GitHub runner
        run: |
          docker build --target web --tag vns-ci-web:check .
          docker build --target api --tag vns-ci-api:check .
          docker build --target worker --tag vns-ci-worker:check .
      - name: Measure local image footprint (no publish or VPS access)
        shell: bash
        run: |
          set -euo pipefail
          web_bytes="$(docker image inspect --format '{{.Size}}' vns-ci-web:check)"
          api_bytes="$(docker image inspect --format '{{.Size}}' vns-ci-api:check)"
          worker_bytes="$(docker image inspect --format '{{.Size}}' vns-ci-worker:check)"
          # docker save combines shared layers; numbers are local tar export sizes,
          # NOT predictions of compressed GHCR layer transfer or VPS storage.
          combined_tar_bytes="$(docker save vns-ci-web:check vns-ci-api:check | wc -c | tr -d '[:space:]')"
          combined_gzip1_bytes="$(docker save vns-ci-web:check vns-ci-api:check | gzip -1 | wc -c | tr -d '[:space:]')"
          printf 'VNS_IMAGE_BYTES web=%s api=%s worker=%s combined_tar=%s combined_gzip1=%s\n' \
            "$web_bytes" "$api_bytes" "$worker_bytes" "$combined_tar_bytes" "$combined_gzip1_bytes"
          {
            echo '### P1-04 Docker image footprint (GitHub runner; no registry push)'
            echo '| Measurement | Bytes |'
            echo '| --- | ---: |'
            printf '| Web uncompressed image | %s |\n' "$web_bytes"
            printf '| API uncompressed image | %s |\n' "$api_bytes"
            printf '| Worker uncompressed image (not intended for preview transfer) | %s |\n' "$worker_bytes"
            printf '| Web+API combined Docker tar export | %s |\n' "$combined_tar_bytes"
            printf '| Web+API combined tar piped through gzip -1 | %s |\n' "$combined_gzip1_bytes"
            echo
            echo 'These are runner-local reference measurements, not GHCR downloads, actual network bytes or guaranteed VPS disk needs. Shared layers and decompression space matter. No images were uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test with no host port publications
        run: |
          set -eu
          trap 'docker rm -f vns-ci-web vns-ci-api >/dev/null 2>&1 || true' EXIT
          docker run -d --name vns-ci-web --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 640m --memory-swap 640m --cpus 0.75 --pids-limit 128 --tmpfs /tmp:rw,nosuid,noexec,size=32m --tmpfs /workspace/apps/web/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000 vns-ci-web:check
          docker run -d --name vns-ci-api --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 192m --memory-swap 192m --cpus 0.35 --pids-limit 128 -e API_HOST=0.0.0.0 -e API_PORT=4000 --tmpfs /tmp:rw,nosuid,noexec,size=32m vns-ci-api:check
          for spec in 'vns-ci-web|http://127.0.0.1:3000/' 'vns-ci-api|http://127.0.0.1:4000/healthz'; do
            name="${spec%%|*}"
            url="${spec#*|}"
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec "$name" node -e 'fetch(process.argv[1]).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' "$url" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "Internal HTTP smoke test failed: $name" >&2
              docker logs --tail 30 "$name" >&2
              exit 1
            fi
          done
          # P1-07: worker MUST fail closed without explicit enable flag/Redis secret.
          if docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 768m --memory-swap 768m --cpus 1.0 -e MAX_RENDER_CONCURRENCY=1 --tmpfs /tmp:rw,nosuid,noexec,size=32m vns-ci-worker:check; then
            echo "Worker incorrectly started without authenticated Redis secret" >&2
            exit 1
          fi
          echo "Worker refused unauthenticated startup as required"
          echo "Image builds and internal smoke checks passed"
      - name: Run opt-in Compose preview with private networks only
        run: |
          set -eu
          mkdir -p secrets
          printf 'ci-only-dummy-password-not-for-deployment\n' > secrets/postgres_password
          chmod 600 secrets/postgres_password
          trap 'docker compose --profile preview down --remove-orphans >/dev/null 2>&1 || true; rm -f secrets/postgres_password' EXIT

          # Reuse images from earlier CI build, without another build or registry push.
          docker tag vns-ci-web:check vns-web:local
          docker tag vns-ci-api:check vns-api:local
          docker compose --profile preview up --no-build --detach --wait --wait-timeout 120

          web_id="$(docker compose --profile preview ps -q web)"
          api_id="$(docker compose --profile preview ps -q api)"
          test -n "$web_id"
          test -n "$api_id"
          test "$(docker ps -q --filter label=com.docker.compose.project=videonews-studio | wc -l | tr -d ' ')" = 2

          for id in "$web_id" "$api_id"; do
            test "$(docker inspect --format '{{.State.Health.Status}}' "$id")" = healthy
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$id")" = videonews-studio
            binding="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$id")"
            if [ "$binding" != "null" ] && [ "$binding" != "{}" ]; then
              echo "Unexpected published host port on container $id" >&2
              exit 1
            fi
          done

          test "$(docker inspect --format '{{with index .NetworkSettings.Networks "videonews-studio_frontend"}}ok{{end}}' "$web_id")" = ok
          test "$(docker inspect --format '{{with index .NetworkSettings.Networks "videonews-studio_frontend"}}ok{{end}}' "$api_id")" = ok
          test "$(docker inspect --format '{{with index .NetworkSettings.Networks "videonews-studio_backend"}}ok{{end}}' "$api_id")" = ok

          echo "Private Compose preview: 2 healthy containers, project networks only, zero published host ports"
