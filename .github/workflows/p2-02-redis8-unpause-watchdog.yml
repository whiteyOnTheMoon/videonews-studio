name: P2-02 Redis 8 unpause watchdog policy CI
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p2_02_redis8_unpause_watchdog_policy.py"
      - "scripts/test_p2_02_redis8_unpause_watchdog_policy.py"
      - "scripts/ci_p2_02_redis8_unpause_watchdog.py"
      - "docs/P2_02_REDIS8_USER_WATCHDOG_PREPARATION_2026_11_11.md"
      - ".github/workflows/p2-02-redis8-unpause-watchdog.yml"
permissions:
  contents: read
concurrency:
  group: redis8-unpause-watchdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  unpause-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
      VNS_P2_REDIS8_WATCHDOG_CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Exact target validation and fail-closed unit tests
        run: |
          python3 -m unittest discover -s scripts \
            -p 'test_p2_02_redis8_unpause_watchdog_policy.py' -v
      - name: Networkless Redis 8 pause/unpause synthetic recovery
        run: python3 scripts/ci_p2_02_redis8_unpause_watchdog.py
      - name: Assert checkout remained unchanged
        run: test -z "$(git status --porcelain)"
