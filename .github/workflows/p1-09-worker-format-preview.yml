# Temporary read-only formatting preview for PR #316. Remove before merge.
name: P1-09 temporary separated worker formatting
on:
  pull_request:
    paths:
      - "apps/worker/src/provider-worker-*"
      - ".github/workflows/p1-09-worker-format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and print sources for exact review
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/worker/src/provider-worker-db-admission.test.ts
            apps/worker/src/provider-worker-db-admission.ts
            apps/worker/src/provider-worker-offline-assembly.test.ts
            apps/worker/src/provider-worker-offline-assembly.ts
            apps/worker/src/provider-worker-preflight-once.test.ts
            apps/worker/src/provider-worker-preflight-once.ts
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            printf '===VNS_P316_FMT_BEGIN:%s===\n' "$file"
            base64 -w0 "$file"
            printf '\n===VNS_P316_FMT_END:%s===\n' "$file"
          done
