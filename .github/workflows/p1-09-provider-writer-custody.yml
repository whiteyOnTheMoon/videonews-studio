name: P1-09 provider writer and KEK custody (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p1_09_provider_writer_custody.py"
      - "scripts/test_p1_09_provider_writer_custody.py"
      - ".github/workflows/p1-09-provider-writer-custody.yml"
permissions:
  contents: read
jobs:
  provider-writer-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      VNS_P109_WRITER_CI_PROJECT: vns-p109-writer-ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python security boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_p1_09_provider_writer_custody.py' -v
      - name: Prepare disposable PostgreSQL fixture secret
        run: |
          mkdir -p -m 700 secrets
          python3 - <<'PY'
          import os
          fd=os.open("secrets/postgres_password",os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,"w") as f:
              f.write("only-for-isolated-ci-not-on-the-VPS\n")
          PY
      - name: Verify real SCRAM writer admission on isolated PostgreSQL 0018
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -p vns-p109-writer-ci -f compose.yaml --profile data \
              down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -p vns-p109-writer-ci -f compose.yaml --profile data \
            up -d --no-deps --no-build --pull missing postgres
          status=missing
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' \
              vns-p109-writer-ci-postgres-1 2>/dev/null || true)"
            [[ "$status" != unhealthy ]] || exit 1
            [[ "$status" != healthy ]] || break
            sleep 2
          done
          [[ "$status" == healthy ]] || exit 1
          sql() {
            docker exec -i vns-p109-writer-ci-postgres-1 \
              psql -X -q -v ON_ERROR_STOP=1 -U vns -d videonews
          }
          for file in $(find db/migrations -maxdepth 1 -name '00*.up.sql' | sort | head -18); do
            sql < "$file"
          done
          # Disposable records ONLY: the real personal operator registration
          # was independently verified by first-owner bootstrap CI.
          sql <<'SQL'
          INSERT INTO vns.editor_accounts
            (username,display_name,role,password_hash,active)
          VALUES ('ci_test_owner','Synthetic CI Admin','admin',
                  'scrypt$' || repeat('0',32) || '$' || repeat('0',128),true);
          INSERT INTO vns.editor_operator_registry
            (login_role,operator_id,operator_label,active)
          VALUES ('vns_ci_synthetic_owner','aaaaaaaa-1234-4123-8123-aaaaaaaaaaaa',
                  'Disposable CI Operator',true);
          SQL
          python3 scripts/p1_09_provider_writer_custody.py --preflight
          python3 scripts/p1_09_provider_writer_custody.py --apply
          if python3 scripts/p1_09_provider_writer_custody.py --preflight; then
            echo "FAIL: duplicate writer preflight accepted"
            exit 1
          fi
          if python3 scripts/p1_09_provider_writer_custody.py --apply; then
            echo "FAIL: duplicate writer activation accepted"
            exit 1
          fi
          actual="$(docker exec vns-p109-writer-ci-postgres-1 \
            psql -X -A -t -q -v ON_ERROR_STOP=1 -U vns -d videonews \
            -c "SELECT (SELECT count(*) FROM pg_auth_members m
            JOIN pg_roles r ON r.oid=m.roleid JOIN pg_roles u ON u.oid=m.member
            WHERE r.rolname='vns_provider_config_writer'
              AND u.rolname='vns_provider_config_login') || '|' ||
            (SELECT count(*) FROM vns.ai_provider_sealed_credentials) || '|' ||
            (SELECT count(*) FROM vns.ai_provider_settings WHERE enabled)")"
          [[ "$actual" == "1|0|0" ]] || exit 1
          echo 'PASS: one dedicated provider login and private master key; providers disabled'
