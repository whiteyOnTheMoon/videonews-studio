name: P2-02 temporary formatting witness
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  print-format-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Print source-only formatting diff without committing
        shell: bash
        run: |
          npx prettier --write apps/api/src/index.ts apps/api/src/studio-feed-refresh.ts apps/api/src/studio-feed-refresh.test.ts apps/web/src/app/admin/studio-dashboard.tsx apps/web/src/lib/studio-news-refresh-proxy.ts apps/web/src/lib/studio-news-refresh-proxy.test.ts
          echo '===VNS_FORMAT_PATCH_START==='
          git --no-pager diff --no-color -- apps/api/src/index.ts apps/api/src/studio-feed-refresh.ts apps/api/src/studio-feed-refresh.test.ts apps/web/src/app/admin/studio-dashboard.tsx apps/web/src/lib/studio-news-refresh-proxy.ts apps/web/src/lib/studio-news-refresh-proxy.test.ts
          echo '===VNS_FORMAT_PATCH_END==='
