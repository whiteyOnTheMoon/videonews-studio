name: P2-01 temporary exact feed endpoint formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/p2-01-reviewed-feed-url-scope-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical source formatting
        run: |
          npx prettier --write \
            apps/api/src/admin-source-registry.ts \
            apps/web/src/app/admin/news-source-editor.tsx \
            apps/web/src/app/admin/news-sources.test.tsx \
            apps/web/src/app/admin/news-sources.tsx \
            apps/web/src/lib/admin-news-sources-proxy.ts \
            apps/worker/src/feed-https-transport.test.ts \
            apps/worker/src/feed-poller.test.ts \
            apps/worker/src/source-registry-export.test.ts \
            apps/worker/src/source-registry.ts \
            docs/P2_01_REVIEWED_FEED_ENDPOINT_0050.md
          node -e "const fs=require('fs');for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            apps/api/src/admin-source-registry.ts \
            apps/web/src/app/admin/news-source-editor.tsx \
            apps/web/src/app/admin/news-sources.test.tsx \
            apps/web/src/app/admin/news-sources.tsx \
            apps/web/src/lib/admin-news-sources-proxy.ts \
            apps/worker/src/feed-https-transport.test.ts \
            apps/worker/src/feed-poller.test.ts \
            apps/worker/src/source-registry-export.test.ts \
            apps/worker/src/source-registry.ts \
            docs/P2_01_REVIEWED_FEED_ENDPOINT_0050.md
