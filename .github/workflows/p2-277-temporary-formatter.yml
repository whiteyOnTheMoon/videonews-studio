name: P2-277 one-time format continuity helpers
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/p2-277-temporary-formatter.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 277 && github.event.pull_request.head.repo.full_name == 'whiteyOnTheMoon/videonews-studio' && github.head_ref == 'feat/p2-audit-page-continuity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/web/src/lib/editorial-export-continuity.ts apps/web/src/lib/editorial-export-continuity.test.ts
      - name: Commit only checked helper formatting
        run: |
          if ! git diff --quiet -- apps/web/src/lib/editorial-export-continuity.ts apps/web/src/lib/editorial-export-continuity.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- apps/web/src/lib/editorial-export-continuity.ts apps/web/src/lib/editorial-export-continuity.test.ts
            git commit -m "style: format P2 audit continuity validators"
            git push origin HEAD:refs/heads/feat/p2-audit-page-continuity
          fi
