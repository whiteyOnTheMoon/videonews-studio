name: P2-10 temporary Prettier diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/p2-10-audit-export-content-continuity-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Output canonical formatted source for the four changed files
        run: |
          npx prettier --write \
            apps/web/src/app/admin/editorial-admin.test.tsx \
            apps/web/src/app/admin/editorial-audit-export.tsx \
            apps/web/src/lib/editorial-export-continuity.test.ts \
            apps/web/src/lib/editorial-export-continuity.ts
          node -e "const fs=require('fs');for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            apps/web/src/app/admin/editorial-admin.test.tsx \
            apps/web/src/app/admin/editorial-audit-export.tsx \
            apps/web/src/lib/editorial-export-continuity.test.ts \
            apps/web/src/lib/editorial-export-continuity.ts
