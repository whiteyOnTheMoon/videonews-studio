name: P1-06 Admin Compose overlay

on:
  pull_request:
    paths:
      - "deploy/compose.admin.yaml"
      - "deploy/compose.personal-editorial-admin.yaml"
      - "scripts/test_p2_personal_editorial_compose.mjs"
      - ".github/workflows/p1-06-admin-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-admin-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated opt-in overlay without starting containers
        env:
          VNS_ADMIN_ORIGIN: https://studio.example.invalid
          VNS_P2_EDITORIAL_PERSONAL_CREDENTIALS_DIR: /tmp/vns-ci-personal-editorial
        run: |
          set -euo pipefail
          mkdir -p secrets
          trap 'rm -rf secrets' EXIT
          printf 'dummy-ci-value-not-a-real-secret\n' > secrets/postgres_password
          printf 'dummy-ci-value-not-a-real-secret\n' > secrets/admin_password_hash
          docker compose -f compose.yaml -f deploy/compose.admin.yaml --profile preview config --format json > /tmp/vns-admin-config.json
          python3 - <<'PY'
          import json
          with open('/tmp/vns-admin-config.json', encoding='utf-8') as fp:
              data = json.load(fp)
          web, api = data['services']['web'], data['services']['api']
          assert web['environment']['VNS_WEB_ADMIN_ENABLED'] == 'true'
          assert api['environment']['VNS_ADMIN_AUTH_ENABLED'] == 'true'
          assert api['environment']['VNS_ADMIN_PASSWORD_HASH_FILE'] == '/run/secrets/admin_password_hash'
          assert 'admin_password_hash' in data['secrets']
          assert any(x['source'] == 'admin_password_hash' for x in api['secrets'])
          assert not web.get('ports') and not api.get('ports')
          print('PASS: admin overlay is opt-in, file-backed and has no published ports')
          PY
          docker compose -f compose.yaml -f deploy/compose.admin.yaml \
            -f deploy/compose.personal-editorial-admin.yaml \
            --profile preview config --quiet
          rm -f /tmp/vns-admin-config.json
      - name: Assert personal editorial secret and runtime isolation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/test_p2_personal_editorial_compose.mjs
      - name: Prepare reviewable P2 personal editor formatting patch
        run: |
          npx prettier --write apps/api/src/personal-editorial-admin.test.ts apps/api/src/personal-editorial-admin.ts apps/api/src/personal-editorial-runtime.test.ts apps/api/src/personal-editorial-runtime.ts apps/web/src/app/admin/editorial-checkpoint-entry.tsx apps/web/src/lib/admin-editorial-proxy.test.ts apps/web/src/lib/admin-editorial-proxy.ts docs/P2-04_10_NAMED_EDITORIAL_CHECKPOINT_RUNTIME.md scripts/test_p2_personal_editorial_compose.mjs
          echo '===VNS_EDITOR_FORMAT_START==='
          git diff --no-color -- apps/api/src/personal-editorial-admin.test.ts apps/api/src/personal-editorial-admin.ts apps/api/src/personal-editorial-runtime.test.ts apps/api/src/personal-editorial-runtime.ts apps/web/src/app/admin/editorial-checkpoint-entry.tsx apps/web/src/lib/admin-editorial-proxy.test.ts apps/web/src/lib/admin-editorial-proxy.ts docs/P2-04_10_NAMED_EDITORIAL_CHECKPOINT_RUNTIME.md scripts/test_p2_personal_editorial_compose.mjs
          echo '===VNS_EDITOR_FORMAT_END==='
          git diff --exit-code -- apps/api/src/personal-editorial-admin.test.ts apps/api/src/personal-editorial-admin.ts apps/api/src/personal-editorial-runtime.test.ts apps/api/src/personal-editorial-runtime.ts apps/web/src/app/admin/editorial-checkpoint-entry.tsx apps/web/src/lib/admin-editorial-proxy.test.ts apps/web/src/lib/admin-editorial-proxy.ts docs/P2-04_10_NAMED_EDITORIAL_CHECKPOINT_RUNTIME.md scripts/test_p2_personal_editorial_compose.mjs
