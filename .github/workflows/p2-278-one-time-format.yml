name: P2-278 scoped one-time formatter
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/p2-278-one-time-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 278 && github.event.pull_request.head.repo.full_name == 'whiteyOnTheMoon/videonews-studio' && github.head_ref == 'feat/p2-feed-runtime-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only affected sources and doc
        run: |
          npx prettier --write             apps/worker/src/feed-observe-once.ts             apps/worker/src/feed-runtime-admission.test.ts             docs/P2_FEED_PRODUCTION_OBSERVATION_RUNBOOK.md
      - name: Commit only reviewed formatting
        run: |
          if ! git diff --quiet --             apps/worker/src/feed-observe-once.ts             apps/worker/src/feed-runtime-admission.test.ts             docs/P2_FEED_PRODUCTION_OBSERVATION_RUNBOOK.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --               apps/worker/src/feed-observe-once.ts               apps/worker/src/feed-runtime-admission.test.ts               docs/P2_FEED_PRODUCTION_OBSERVATION_RUNBOOK.md
            git commit -m "style: format P2 gated observation changes"
            git push origin HEAD:refs/heads/feat/p2-feed-runtime-readiness
          fi
