name: P1-07 protected admin job submission
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/src/lib/admin-jobs-proxy*"
      - "apps/web/src/lib/admin-jobs-list*"
      - "apps/web/src/lib/admin-evidence-proxy*"
      - "apps/web/src/lib/editor-proxy*"
      - "apps/web/src/app/api/editor/**"
      - "apps/web/src/app/api/admin/evidence/**"
      - "apps/web/src/app/admin/**"
      - "apps/web/src/app/globals.css"
      - "apps/web/src/app/api/admin/jobs/**"
      - "apps/web/package.json"
      - "Dockerfile"
      - "package-lock.json"
      - "db/scripts/test_admin_jobs.sh"
      - "scripts/ci_editor_account_lifecycle.mjs"
      - "scripts/test_editor_auth_integration.mjs"
      - ".github/workflows/p1-07-admin-jobs.yml"
permissions:
  contents: read
jobs:
  admin-job-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify and capture any npm lockfile drift
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '===VNS_LOCK_START==='
          git diff --no-color -- package-lock.json
          echo '===VNS_LOCK_END==='
          git diff --exit-code -- package-lock.json
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify formatting and capture style patch
        run: |
          npx prettier --write apps/api/src/admin-jobs.ts apps/api/src/admin-jobs.test.ts apps/api/src/admin-evidence.ts apps/api/src/admin-evidence.test.ts apps/api/src/editor-auth.ts apps/api/src/editor-auth.test.ts apps/api/src/auth.ts apps/api/src/server.ts apps/api/src/index.ts apps/web/src/lib/admin-jobs-proxy.ts apps/web/src/lib/admin-jobs-proxy.test.ts apps/web/src/app/api/admin/jobs/route.ts .github/workflows/p1-07-admin-jobs.yml scripts/test_admin_jobs_integration.mjs scripts/ci_editor_account_lifecycle.mjs scripts/test_editor_auth_integration.mjs apps/web/src/lib/admin-jobs-list.ts apps/web/src/lib/admin-jobs-list.test.ts apps/web/src/lib/admin-evidence-proxy.ts apps/web/src/lib/admin-evidence-proxy.test.ts apps/web/src/lib/editor-proxy.ts apps/web/src/lib/editor-proxy.test.ts apps/web/src/app/admin/editor-login.tsx apps/web/src/app/admin/editor-login.test.tsx apps/web/src/app/api/editor/login/route.ts apps/web/src/app/api/editor/logout/route.ts apps/web/src/app/api/editor/me/route.ts apps/web/src/app/api/admin/evidence/route.ts apps/web/src/app/api/admin/evidence/review/route.ts apps/web/src/app/admin/research-jobs.tsx apps/web/src/app/admin/research-jobs.test.tsx apps/web/src/app/admin/evidence-review.tsx apps/web/src/app/admin/evidence-review.test.tsx apps/web/src/app/admin/page.tsx apps/web/src/app/globals.css docs/P1-07_ADMIN_JOB_SUBMISSION.md
          echo '===VNS_FORMAT_START==='
          git diff --no-color -- apps/api/src/admin-jobs.ts apps/api/src/admin-jobs.test.ts apps/api/src/admin-evidence.ts apps/api/src/admin-evidence.test.ts apps/api/src/editor-auth.ts apps/api/src/editor-auth.test.ts apps/api/src/auth.ts apps/api/src/server.ts apps/api/src/index.ts apps/web/src/lib/admin-jobs-proxy.ts apps/web/src/lib/admin-jobs-proxy.test.ts apps/web/src/app/api/admin/jobs/route.ts .github/workflows/p1-07-admin-jobs.yml scripts/test_admin_jobs_integration.mjs scripts/ci_editor_account_lifecycle.mjs scripts/test_editor_auth_integration.mjs apps/web/src/lib/admin-jobs-list.ts apps/web/src/lib/admin-jobs-list.test.ts apps/web/src/lib/admin-evidence-proxy.ts apps/web/src/lib/admin-evidence-proxy.test.ts apps/web/src/lib/editor-proxy.ts apps/web/src/lib/editor-proxy.test.ts apps/web/src/app/admin/editor-login.tsx apps/web/src/app/admin/editor-login.test.tsx apps/web/src/app/api/editor/login/route.ts apps/web/src/app/api/editor/logout/route.ts apps/web/src/app/api/editor/me/route.ts apps/web/src/app/api/admin/evidence/route.ts apps/web/src/app/api/admin/evidence/review/route.ts apps/web/src/app/admin/research-jobs.tsx apps/web/src/app/admin/research-jobs.test.tsx apps/web/src/app/admin/evidence-review.tsx apps/web/src/app/admin/evidence-review.test.tsx apps/web/src/app/admin/page.tsx apps/web/src/app/globals.css docs/P1-07_ADMIN_JOB_SUBMISSION.md
          echo '===VNS_FORMAT_END==='
          git diff --exit-code -- apps/api/src/admin-jobs.ts apps/api/src/admin-jobs.test.ts apps/api/src/admin-evidence.ts apps/api/src/admin-evidence.test.ts apps/api/src/editor-auth.ts apps/api/src/editor-auth.test.ts apps/api/src/auth.ts apps/api/src/server.ts apps/api/src/index.ts apps/web/src/lib/admin-jobs-proxy.ts apps/web/src/lib/admin-jobs-proxy.test.ts apps/web/src/app/api/admin/jobs/route.ts .github/workflows/p1-07-admin-jobs.yml scripts/test_admin_jobs_integration.mjs scripts/ci_editor_account_lifecycle.mjs scripts/test_editor_auth_integration.mjs apps/web/src/lib/admin-jobs-list.ts apps/web/src/lib/admin-jobs-list.test.ts apps/web/src/lib/admin-evidence-proxy.ts apps/web/src/lib/admin-evidence-proxy.test.ts apps/web/src/lib/editor-proxy.ts apps/web/src/lib/editor-proxy.test.ts apps/web/src/app/admin/editor-login.tsx apps/web/src/app/admin/editor-login.test.tsx apps/web/src/app/api/editor/login/route.ts apps/web/src/app/api/editor/logout/route.ts apps/web/src/app/api/editor/me/route.ts apps/web/src/app/api/admin/evidence/route.ts apps/web/src/app/api/admin/evidence/review/route.ts apps/web/src/app/admin/research-jobs.tsx apps/web/src/app/admin/research-jobs.test.tsx apps/web/src/app/admin/evidence-review.tsx apps/web/src/app/admin/evidence-review.test.tsx apps/web/src/app/admin/page.tsx apps/web/src/app/globals.css docs/P1-07_ADMIN_JOB_SUBMISSION.md
      - name: Build and run isolated workspace tests
        run: |
          npm run build
          npm test
      - name: Test admin auth and transactional PostgreSQL job creation
        run: bash db/scripts/test_admin_jobs.sh
      - name: Build production API image without publishing
        run: docker build --pull=false --target api -t vns-p1-07-admin-api-ci .
