name: P2-05 temporary claim handoff formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/p2-05-10-claim-checkpoint-handoff-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compute canonical UTF-8 source for claim handoff
        run: |
          npx prettier --write \
            apps/worker/src/offline-claim-checkpoint-handoff.test.ts \
            apps/worker/src/offline-claim-checkpoint-handoff.ts
          node -e "const fs=require('fs');for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            apps/worker/src/offline-claim-checkpoint-handoff.test.ts \
            apps/worker/src/offline-claim-checkpoint-handoff.ts
