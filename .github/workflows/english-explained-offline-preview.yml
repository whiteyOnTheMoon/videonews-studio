name: English Earth & Climate Explained source and safety checks only

on:
  pull_request:
    branches: [main]
    paths:
      - "content/news/ozone-2026-explained-en.json"
      - "scripts/vps_p3_explained_preview.mjs"
      - "packages/shared/src/explained-script-structure.ts"
      - "packages/shared/src/explained-script-structure.test.ts"
      - "packages/shared/src/narration-timeline.ts"
      - "packages/shared/src/narration-timeline.test.ts"
      - "packages/shared/src/offline-storyboard-graphics.ts"
      - "packages/shared/src/offline-storyboard-graphics-en.test.ts"
      - "packages/shared/src/index.ts"
      - ".github/workflows/english-explained-offline-preview.yml"
      - "docs/EXPLAINED_SCRIPT_STRUCTURE_V1.md"
      - "docs/ENGLISH_EXPLAINED_CI_PILOT.md"
      - "docs/VPS_PRIVATE_PREVIEW_RUNBOOK.md"

permissions:
  contents: read

jobs:
  english-explained-static-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test source code and structures without creating any video
        run: |
          npm run build --workspace @vns/shared
          node --check scripts/vps_p3_explained_preview.mjs
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
      - name: Confirm VPS-only renderer refuses GitHub Actions even with forged approval
        run: |
          if VNS_VPS_PREVIEW_APPROVED=PRIVATE_REVIEW_ONLY node scripts/vps_p3_explained_preview.mjs; then
            echo "ERROR: VPS renderer started in GitHub Actions"
            exit 1
          fi
