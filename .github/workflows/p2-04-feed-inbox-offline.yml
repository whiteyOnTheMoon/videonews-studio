name: P2-04 personal feed inbox prototype (offline)
on:
  pull_request:
    paths:
      - "db/migrations/0063_named_feed_inbox.*"
      - "apps/api/src/personal-editorial-admin*"
      - "apps/web/src/lib/admin-editorial-proxy*"
      - "apps/web/src/lib/editorial-feed-inbox.ts"
      - "apps/web/src/app/admin/editorial-feed-inbox.tsx"
      - "apps/web/src/app/admin/editorial-admin.test.tsx"
      - "apps/web/src/app/admin/page.tsx"
      - "apps/web/src/app/api/admin/editorial-feed-inbox/route.ts"
      - "apps/web/package.json"
      - "scripts/test_p2_04_feed_inbox_contract.py"
      - ".github/workflows/p2-04-feed-inbox-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static schema authorization contract
        run: python3 -m unittest discover -s scripts -p test_p2_04_feed_inbox_contract.py -v
      - name: Install reproducible JS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile shared, API and Web
        run: |
          npm run build --workspace @vns/shared
          npm run build --workspace @vns/api
          npm run typecheck --workspace @vns/web
      - name: Personal Admin API and browser validation
        run: |
          npm run test --workspace @vns/api
          npm run test --workspace @vns/web
