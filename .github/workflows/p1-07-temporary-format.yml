name: Temporary P1-07 formatter export
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p1-07-temporary-format.yml"
permissions:
  contents: read
jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format files and export for reviewed PR commit
        run: |
          npx prettier --write docs/P1-07_ACCEPTANCE_AUDIT.md docs/P1-07_DATA_CANARY_RUNBOOK.md docs/P1-07_LIVE_ACCEPTANCE_STATUS.md docs/P1-07_LIVE_PROBE_RECEIPT.md docs/P1-07_OPERATOR_NO_BACKUP_DECISION.md docs/P1-07_VPS_PREFLIGHT_REPORT.md docs/P1-07_WORKER_CANARY_RUNBOOK.md scripts/p1_07_idle_queue_check.mjs
          python3 - <<'PY'
          import base64
          from pathlib import Path
          paths = ["docs/P1-07_ACCEPTANCE_AUDIT.md","docs/P1-07_DATA_CANARY_RUNBOOK.md","docs/P1-07_LIVE_ACCEPTANCE_STATUS.md","docs/P1-07_LIVE_PROBE_RECEIPT.md","docs/P1-07_OPERATOR_NO_BACKUP_DECISION.md","docs/P1-07_VPS_PREFLIGHT_REPORT.md","docs/P1-07_WORKER_CANARY_RUNBOOK.md","scripts/p1_07_idle_queue_check.mjs"]
          for name in paths:
              blob = Path(name).read_bytes()
              print("FMT|" + name + "|" + base64.b64encode(blob).decode("ascii"))
          PY
