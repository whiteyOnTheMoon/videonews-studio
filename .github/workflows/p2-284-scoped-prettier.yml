name: One-time P2-284 source publisher formatting
on:
  push:
    branches:
      - feat/p2-01-source-publisher-runtime-entrypoint
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-01-source-publisher-runtime-entrypoint
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format exactly the two failing files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-01-source-publisher-runtime-entrypoint
          npx prettier --write apps/worker/src/feed-source-publish-once.ts apps/worker/src/feed-source-publish-once.test.ts
          rm .github/workflows/p2-284-scoped-prettier.yml
          git add apps/worker/src/feed-source-publish-once.ts apps/worker/src/feed-source-publish-once.test.ts .github/workflows/p2-284-scoped-prettier.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): format source publisher and remove temporary workflow'
          git push origin HEAD:refs/heads/feat/p2-01-source-publisher-runtime-entrypoint
