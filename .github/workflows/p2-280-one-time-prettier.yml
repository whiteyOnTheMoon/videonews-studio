name: One-time PR280 scoped formatting
on:
  push:
    branches:
      - feat/p2-01-02-runtime-source-revocation-gate

permissions:
  contents: write

jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-01-02-runtime-source-revocation-gate
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format exactly one test and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-01-02-runtime-source-revocation-gate
          npx prettier --write apps/worker/src/feed-scheduler-composition.test.ts
          rm .github/workflows/p2-280-one-time-prettier.yml
          git add apps/worker/src/feed-scheduler-composition.test.ts .github/workflows/p2-280-one-time-prettier.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): one-time scoped prettier and workflow self-removal'
          git push origin HEAD:refs/heads/feat/p2-01-02-runtime-source-revocation-gate
