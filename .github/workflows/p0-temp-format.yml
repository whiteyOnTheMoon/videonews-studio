name: Temporary P0 formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p0-temp-format.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print canonical Prettier content for reviewed git update
        run: |
          npx prettier --write docs/P0_P1_ISSUE_CLOSEOUT.md
          python3 - <<'PY'
          import base64
          from pathlib import Path
          print("CANONICAL_P0|" + base64.b64encode(Path("docs/P0_P1_ISSUE_CLOSEOUT.md").read_bytes()).decode("ascii"))
          PY
