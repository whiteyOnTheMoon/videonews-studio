name: P2-A continuous projector temporary Prettier diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/p2-a-continuous-multisource-rank-projector-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Emit canonical formatted source
        run: |
          npx prettier --write \
            apps/worker/src/feed-project-continuous.test.ts \
            scripts/test_p2_feed_projection_compose.mjs
          node -e "const fs=require('fs');for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            apps/worker/src/feed-project-continuous.test.ts \
            scripts/test_p2_feed_projection_compose.mjs
