name: P2-08 temporary Prettier diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report-formatted:
    if: github.event.pull_request.head.ref == 'fix/p2-08-independent-script-qa-cost-integrity-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only the two reported files, emit nonsecret UTF-8 content
        run: |
          npx prettier --write \
            apps/worker/src/bounded-editorial-production.test.ts \
            docs/P2-02_IONOS_BESZEL_ACCEPTANCE_2026-10-27.md
          node -e "const fs=require('fs'); for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            apps/worker/src/bounded-editorial-production.test.ts \
            docs/P2-02_IONOS_BESZEL_ACCEPTANCE_2026-10-27.md
