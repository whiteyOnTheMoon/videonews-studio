name: P1-09 guarded 0043 to 0048 release upgrade (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p1_09_schema_0043_to_0048.py"
      - "scripts/test_p1_09_schema_0043_to_0048.py"
      - ".github/workflows/p1-09-schema-0048-upgrade.yml"
      - "db/migrations/0044_named_provider_job_authorization.up.sql"
      - "db/migrations/0045_atomic_named_provider_budget_gate.up.sql"
      - "db/migrations/0046_provider_named_sealed_outbox.up.sql"
      - "db/migrations/0047_named_provider_job_submission.up.sql"
      - "db/migrations/0048_provider_outbox_delivery_receipt.up.sql"
permissions:
  contents: read
concurrency:
  group: p1-09-0048-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guarded-provider-schema-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      VNS_P109_0048_CI_PROJECT: vns-p109-0048-ci
    steps:
      - uses: actions/checkout@v4
      - name: Offline guard unit tests
        run: python3 -m unittest discover -s scripts -p 'test_p1_09_schema_0043_to_0048.py' -v
      - name: Create disposable PostgreSQL password
        run: |
          install -d -m 700 secrets
          python3 - <<'PY'
          import os
          fd = os.open("secrets/postgres_password",
              os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          try:
              os.write(fd,b"ci-ephemeral-only-not-a-real-credential\n")
          finally:
              os.close(fd)
          PY
      - name: Run exact production helper on isolated PostgreSQL 17
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose -p vns-p109-0048-ci -f compose.yaml --profile data \
              down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -p vns-p109-0048-ci -f compose.yaml --profile data \
            up -d --no-deps --no-build --pull missing postgres
          status=missing
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' \
              vns-p109-0048-ci-postgres-1 2>/dev/null || true)"
            [[ "$status" != unhealthy ]] || exit 1
            [[ "$status" != healthy ]] || break
            sleep 2
          done
          [[ "$status" == healthy ]] || exit 1
          sql() {
            docker exec -i vns-p109-0048-ci-postgres-1 \
              psql -X -q -v ON_ERROR_STOP=1 -U vns -d videonews
          }
          for file in $(find db/migrations -maxdepth 1 -name '00*.up.sql' | sort | head -43); do
            sql < "$file" >/dev/null
          done
          python3 scripts/p1_09_schema_0043_to_0048.py --status
          python3 scripts/p1_09_schema_0043_to_0048.py --preflight
          if python3 scripts/p1_09_schema_0043_to_0048.py --apply; then
            echo "FAIL: migration accepted without separate approval"; exit 1
          fi
          VNS_P109_0048_OPERATOR_APPROVED=APPLY_ADDITIVE_0044_0048 \
            python3 scripts/p1_09_schema_0043_to_0048.py --apply
          python3 scripts/p1_09_schema_0043_to_0048.py --status
          if python3 scripts/p1_09_schema_0043_to_0048.py --preflight; then
            echo "FAIL: prior schema accepted as fresh baseline"; exit 1
          fi
          if VNS_P109_0048_OPERATOR_APPROVED=APPLY_ADDITIVE_0044_0048 \
              python3 scripts/p1_09_schema_0043_to_0048.py --apply; then
            echo "FAIL: repeated migration accepted"; exit 1
          fi
          result="$(docker exec vns-p109-0048-ci-postgres-1 \
            psql -X -A -t -q -v ON_ERROR_STOP=1 -U vns -d videonews -c \
            "SELECT count(*)::text || '|' || max(version) FROM vns.schema_migrations")"
          [[ "$result" == "48|0048_provider_outbox_delivery_receipt" ]]
          echo "PASS: isolated guarded schema 0043->0048; no paid providers or budgets enabled"
