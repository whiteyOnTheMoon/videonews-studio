name: P2-276 one-time format bridge
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/p2-276-temporary-formatter.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 276 && github.event.pull_request.head.repo.full_name == 'whiteyOnTheMoon/videonews-studio' && github.head_ref == 'feat/p2-gated-feed-bullmq-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/worker/src/feed-bullmq-bridge.ts apps/worker/src/feed-bullmq-bridge.test.ts scripts/ci_p2_integrated_ports.mjs
      - name: Commit exact bridge formatting only
        run: |
          if ! git diff --quiet -- apps/worker/src/feed-bullmq-bridge.ts apps/worker/src/feed-bullmq-bridge.test.ts scripts/ci_p2_integrated_ports.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- apps/worker/src/feed-bullmq-bridge.ts apps/worker/src/feed-bullmq-bridge.test.ts scripts/ci_p2_integrated_ports.mjs
            git commit -m "style: format isolated feed BullMQ bridge"
            git push origin HEAD:refs/heads/feat/p2-gated-feed-bullmq-bridge
          fi
