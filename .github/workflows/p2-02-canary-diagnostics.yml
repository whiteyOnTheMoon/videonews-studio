name: P2-02 canary sanitized feed failure diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/worker/src/feed-poller.ts"
      - "apps/worker/src/feed-poller.test.ts"
      - "docs/P2_02_ARTICLE_QUERY_IDENTITY_REVIEW.md"
      - "apps/worker/src/feed-observer-decode-diagnostics.ts"
      - "apps/worker/src/feed-observer-decode-diagnostics.test.ts"
      - "apps/worker/src/feed-https-transport.ts"
      - "apps/worker/src/feed-nasa-bounded-response.ts"
      - "apps/worker/src/feed-nasa-bounded-response.test.ts"
      - "apps/worker/src/feed-runtime-admission.ts"
      - "apps/worker/src/feed-scheduler-composition.ts"
      - "apps/worker/src/feed-canary-failure-stages.test.ts"
      - "compose.feed-observation.yaml"
      - ".github/workflows/p2-02-canary-diagnostics.yml"
permissions:
  contents: read
jobs:
  stage-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          files="apps/worker/src/feed-observer-decode-diagnostics.ts apps/worker/src/feed-observer-decode-diagnostics.test.ts apps/worker/src/feed-nasa-bounded-response.ts apps/worker/src/feed-nasa-bounded-response.test.ts apps/worker/src/feed-https-transport.ts apps/worker/src/feed-https-transport.test.ts apps/worker/src/feed-canary-source-selection.ts apps/worker/src/feed-canary-source-selection.test.ts apps/worker/src/feed-poller.ts apps/worker/src/feed-poller.test.ts apps/worker/src/feed-scheduler-composition.ts apps/worker/src/feed-scheduler-composition.test.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-runtime-admission.test.ts compose.feed-observation.yaml docs/P2_02_ARTICLE_QUERY_IDENTITY_REVIEW.md docs/P2_02_NASA_DECODE_REFUSAL_DIAGNOSIS.md docs/P2_02_NASA_QUEUE_READONLY_PREFLIGHT.md docs/P2_02_NASA_SIGNED_SINGLE_SOURCE_CANARY.md docs/P2_02_NASA_SIGNED_SQL_PARITY_DIAGNOSIS.md docs/P2_02_NOAA_SCOPED_PERSISTENCE_CANARY.md docs/P2_02_USGS_SINGLE_SOURCE_CANARY_10_10.md docs/P2_02_USGS_COMMIT_GUARD_RECONCILIATION_10_10.md"
          if ! npx prettier --check $files; then
            npx prettier --write $files
            git diff -- $files
            exit 1
          fi
      - run: |
          npm run build --workspace @vns/shared
          npm run build --workspace @vns/worker
          node --test apps/worker/dist/feed-canary-failure-stages.test.js apps/worker/dist/feed-poller.test.js apps/worker/dist/feed-scheduler-composition.test.js apps/worker/dist/feed-queue-contract.test.js apps/worker/dist/feed-nasa-bounded-response.test.js apps/worker/dist/feed-observer-decode-diagnostics.test.js apps/worker/dist/feed-runtime-admission.test.js apps/worker/dist/feed-https-transport.test.js
          node --test scripts/test_p2_feed_compose.mjs
