name: One-time P2-282 scoped formatting
on:
  push:
    branches:
      - feat/p2-01-atomic-db-signed-export-bridge
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-01-atomic-db-signed-export-bridge
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format exactly three failing files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-01-atomic-db-signed-export-bridge
          npx prettier --write apps/worker/src/postgres-admin-source-publisher.ts apps/worker/src/postgres-admin-source-publisher.test.ts docs/P2-01_DB_SIGNED_EXPORT_BRIDGE_0034.md
          rm .github/workflows/p2-282-format-once.yml
          git add apps/worker/src/postgres-admin-source-publisher.ts apps/worker/src/postgres-admin-source-publisher.test.ts docs/P2-01_DB_SIGNED_EXPORT_BRIDGE_0034.md .github/workflows/p2-282-format-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): scoped source export formatting and workflow self-removal'
          git push origin HEAD:refs/heads/feat/p2-01-atomic-db-signed-export-bridge
