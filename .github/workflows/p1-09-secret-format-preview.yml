# Temporary read-only formatter check; removed before merge.
name: P1-09 temporary claimed secret formatting preview
on:
  pull_request:
    paths:
      - "apps/worker/src/provider-claimed-credential-scope*"
      - ".github/workflows/p1-09-secret-format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact formatted sources for review
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/worker/src/provider-claimed-credential-scope.test.ts
            apps/worker/src/provider-claimed-credential-scope.ts
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            printf '===VNS_SECRET_FMT_BEGIN:%s===\n' "$file"
            base64 -w0 "$file"
            printf '\n===VNS_SECRET_FMT_END:%s===\n' "$file"
          done
