name: P2-02 isolated feed Redis ACL (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/p2_02_feed_redis_acl_custody.py"
      - "scripts/test_p2_02_feed_redis_acl_custody.py"
      - "scripts/ci_p2_02_feed_redis_acl.sh"
      - "docs/P2_02_FEED_REDIS_ACL_ROLLOUT.md"
      - ".github/workflows/p2-02-feed-redis-acl.yml"
permissions:
  contents: read
concurrency:
  group: p2-02-feed-redis-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  feed-redis-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify private staged credentials and no implicit live changes
        run: python3 -m unittest discover -s scripts -p 'test_p2_02_feed_redis_acl_custody.py' -v
      - name: Exercise only synthetic users in disposable offline Redis
        run: bash scripts/ci_p2_02_feed_redis_acl.sh
