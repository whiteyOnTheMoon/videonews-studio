name: P2-09 temporary Prettier diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report-formatted:
    if: github.event.pull_request.head.ref == 'fix/p2-09-profile-validation-across-api-web-worker-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compute canonical source for changed profile validators
        run: |
          npx prettier --write \
            apps/api/src/personal-editorial-admin.ts \
            apps/web/src/app/admin/editorial-profiles.tsx \
            apps/worker/src/offline-editorial-pipeline.test.ts \
            apps/worker/src/offline-editorial-pipeline.ts
          node -e "const fs=require('fs');for(const p of process.argv.slice(1)) console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')" \
            apps/api/src/personal-editorial-admin.ts \
            apps/web/src/app/admin/editorial-profiles.tsx \
            apps/worker/src/offline-editorial-pipeline.test.ts \
            apps/worker/src/offline-editorial-pipeline.ts
