name: One-time P2-283 scoped formatting
on:
  push:
    branches:
      - feat/p2-01-02-signed-feed-runtime-admission
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == 'whiteyOnTheMoon/videonews-studio' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-01-02-signed-feed-runtime-admission
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format four changed files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/p2-01-02-signed-feed-runtime-admission
          npx prettier --write apps/worker/src/feed-observe-once.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-source-anchor-identity.test.ts docs/P2-02_SIGNED_ONLY_FEED_OBSERVATION.md
          rm .github/workflows/p2-283-format-once.yml
          git add apps/worker/src/feed-observe-once.ts apps/worker/src/feed-runtime-admission.ts apps/worker/src/feed-source-anchor-identity.test.ts docs/P2-02_SIGNED_ONLY_FEED_OBSERVATION.md .github/workflows/p2-283-format-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(p2): scoped signed observer formatting and workflow self-removal'
          git push origin HEAD:refs/heads/feat/p2-01-02-signed-feed-runtime-admission
