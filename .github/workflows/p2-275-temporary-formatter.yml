name: P2-275 one-time format CI fixture
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/p2-275-temporary-formatter.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 275 && github.event.pull_request.head.repo.full_name == 'whiteyOnTheMoon/videonews-studio' && github.head_ref == 'feat/p2-redis-postgres-isolated-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/ci_p2_integrated_ports.mjs
      - name: Commit exact fixture formatting only
        run: |
          if ! git diff --quiet -- scripts/ci_p2_integrated_ports.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- scripts/ci_p2_integrated_ports.mjs
            git commit -m "style: format isolated P2 ports acceptance fixture"
            git push origin HEAD:refs/heads/feat/p2-redis-postgres-isolated-handoff
          fi
