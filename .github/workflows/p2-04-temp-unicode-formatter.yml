name: P2-04 temporary formatter for Unicode matcher

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  emit:
    if: github.event.pull_request.head.ref == 'fix/p2-04-metadata-ranking-integrity-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compute canonical UTF-8 formatted source
        run: |
          npx prettier --write apps/worker/src/offline-editorial-pipeline.ts
          node -e "const fs=require('fs');const p='apps/worker/src/offline-editorial-pipeline.ts';console.log('VNS_FORMAT_START '+p+' '+fs.readFileSync(p).toString('base64')+' VNS_FORMAT_END')"
