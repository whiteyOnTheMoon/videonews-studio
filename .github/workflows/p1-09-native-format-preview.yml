# Temporary read-only formatter check; removed from branch before merge.
name: P1-09 temporary native transport formatting preview
on:
  pull_request:
    paths:
      - "apps/worker/src/provider-native-text-transport*"
      - "apps/worker/src/provider-native-usage*"
      - "apps/worker/src/provider-one-shot-text-coordinator*"
      - ".github/workflows/p1-09-native-format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format and print exact source files for review
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/worker/src/provider-native-text-transport.test.ts
            apps/worker/src/provider-native-text-transport.ts
            apps/worker/src/provider-native-usage.test.ts
            apps/worker/src/provider-native-usage.ts
            apps/worker/src/provider-one-shot-text-coordinator.test.ts
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            printf '===VNS_NATIVE_FMT_BEGIN:%s===\n' "$file"
            base64 -w0 "$file"
            printf '\n===VNS_NATIVE_FMT_END:%s===\n' "$file"
          done
