# P1-07: planning-only overlay. NO operator deployment approval.
# Keep editorial components deliberately disabled even if profile is selected.
# Requires independent reviewed login provisioning and explicit future change.
x-ops-base: &ops-base
  profiles: [editorial-ops]
  image: vns-worker:local
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  networks: [backend]
  pids_limit: 96
  mem_limit: 256m
  memswap_limit: 256m
  cpus: 0.4

services:
  outbox-dispatch:
    <<: *ops-base
    command: ["node", "apps/worker/dist/dispatch.js"]
    environment:
      VNS_OUTBOX_DISPATCH_ENABLED: "false"
      VNS_PG_RUNTIME_IDENTITIES_ENABLED: "false"
      VNS_POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/pg_outbox_dispatch_password
      VNS_REDIS_HOST: redis
      VNS_REDIS_PORT: "6379"
      VNS_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [pg_outbox_dispatch_password, redis_password]

  job-status-sync:
    <<: *ops-base
    command: ["node", "apps/worker/dist/status-sync.js"]
    environment:
      VNS_STATUS_RECONCILE_ENABLED: "false"
      VNS_PG_RUNTIME_IDENTITIES_ENABLED: "false"
      VNS_POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/pg_job_status_sync_password
      VNS_REDIS_HOST: redis
      VNS_REDIS_PORT: "6379"
      VNS_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [pg_job_status_sync_password, redis_password]

secrets:
  pg_outbox_dispatch_password:
    file: ./secrets/pg_outbox_dispatch_password
  pg_job_status_sync_password:
    file: ./secrets/pg_job_status_sync_password
  redis_password:
    file: ./secrets/redis_password
