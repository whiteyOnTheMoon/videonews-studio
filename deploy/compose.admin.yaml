# P1-06: Explicit opt-in ONLY. Do not include this overlay in routine preview starts.
# Requires an operator-provisioned secret file that is never committed to Git.
services:
  web:
    environment:
      VNS_WEB_ADMIN_ENABLED: "true"
      VNS_ADMIN_ORIGIN: ${VNS_ADMIN_ORIGIN:?Set exact HTTPS studio origin}
      VNS_API_INTERNAL_URL: http://api:4000

  api:
    environment:
      VNS_ADMIN_AUTH_ENABLED: "true"
      VNS_ADMIN_ORIGIN: ${VNS_ADMIN_ORIGIN:?Set exact HTTPS studio origin}
      VNS_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
    secrets:
      - admin_password_hash

secrets:
  admin_password_hash:
    file: ./secrets/admin_password_hash
